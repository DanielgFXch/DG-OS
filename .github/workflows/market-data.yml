name: Update Market Data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch XAUUSD Market Brain data from TwelveData
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          set -e
          if [ -z "$TWELVEDATA_API_KEY" ]; then
            echo "TWELVEDATA_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p data

          # Shared jq filter (see docs/MARKET_BRAIN.md - "scan forward for a real
          # candle"): TwelveData emits a bar for every calendar period, including
          # ones with no real trading (a flat, carried-forward placeholder). Never
          # trust values[0] blindly - scan forward for the first bar whose range is
          # a meaningful fraction of price (> 0.1%). Reused for daily/weekly/monthly.
          REAL_BAR_FILTER='
            (.values // []) as $v
            | ([$v[] | select(
                 ((.high|tonumber?) as $h | (.low|tonumber?) as $l | (.close|tonumber?) as $c
                  | ($h != null and $l != null and $c != null and $c > 0 and (($h - $l) / $c) > 0.001))
               )] | .[0]) // ($v[0] // {})
          '

          fetch_series() {
            local interval="$1" outputsize="$2"
            local resp status
            resp=$(curl -sS "https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=${interval}&outputsize=${outputsize}&apikey=${TWELVEDATA_API_KEY}")
            status=$(echo "$resp" | jq -r '.status // empty')
            if [ "$status" = "error" ]; then
              echo "TwelveData time_series ($interval) error:" >&2
              echo "$resp" | jq -r '.message // .' >&2
              exit 1
            fi
            echo "$resp" | jq -c '.'
          }

          quote=$(curl -sS "https://api.twelvedata.com/quote?symbol=XAU/USD&apikey=${TWELVEDATA_API_KEY}")
          qstatus=$(echo "$quote" | jq -r '.status // empty')
          if [ "$qstatus" = "error" ]; then
            echo "TwelveData quote error:"
            echo "$quote" | jq -r '.message // .'
            exit 1
          fi

          # /quote's own open/high/low only cover "today" and go misleadingly flat
          # around weekends/day-boundaries - the daily candle from time_series is
          # the reliable source, same reasoning for weekly/monthly.
          # Preserve complete real OHLC history for the SAME core Market Brain
          # (4H/15M/5M confirmation is derived from provider candles, never fake).
          dailyRaw=$(fetch_series 1day 120)
          weeklyRaw=$(fetch_series 1week 52)
          monthlyRaw=$(fetch_series 1month 24)
          daily=$(echo "$dailyRaw" | jq -c "$REAL_BAR_FILTER")
          weekly=$(echo "$weeklyRaw" | jq -c "$REAL_BAR_FILTER")
          monthly=$(echo "$monthlyRaw" | jq -c "$REAL_BAR_FILTER")

          # Extra granular feeds are best effort. Missing entitlement/credits
          # MUST NOT take down the existing price/session baseline. The
          # snapshot engine then truthfully marks confirmations unavailable.
          fetch_optional_series() {
            local interval="$1" outputsize="$2" resp
            if ! resp=$(curl -fsS --retry 1 --max-time 20               "https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=${interval}&outputsize=${outputsize}&timezone=UTC&apikey=${TWELVEDATA_API_KEY}"); then
              echo "Optional TwelveData ${interval} temporarily unavailable." >&2
              printf '{"values":[]}'
              return
            fi
            if ! echo "$resp" | jq -e '(.values|type)=="array"' >/dev/null 2>&1; then
              echo "Optional TwelveData ${interval} not authorized or unavailable — no synthetic candles." >&2
              printf '{"values":[]}'
              return
            fi
            echo "$resp" | jq -c '.'
          }

          # Session Engine (Asia/London/NY): fetch enough hourly candles to reach
          # back across a full weekend (72h) in UTC, then for each session window
          # group candles by calendar day and pick the most recent day whose range
          # is meaningful - same "scan forward for a real candle" reasoning as
          # daily/weekly/monthly, applied per session instead of per calendar
          # period. See docs/MARKET_BRAIN.md for the full write-up.
          intraday=$(curl -sS "https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=1h&outputsize=168&timezone=UTC&apikey=${TWELVEDATA_API_KEY}")
          istatus=$(echo "$intraday" | jq -r '.status // empty')
          if [ "$istatus" = "error" ]; then
            echo "TwelveData time_series (1h) error:"
            echo "$intraday" | jq -r '.message // .'
            exit 1
          fi

          price=$(echo "$quote" | jq -r '.close // 0')
          SESSION_FILTER='
            def session_range(startHour; endHour; price):
              (.values // []) as $v
              | [ $v[] | select((.datetime[11:13]|tonumber) >= startHour and (.datetime[11:13]|tonumber) < endHour)
                         | . + {day: .datetime[0:10]} ]
              | group_by(.day)
              | map({day: .[0].day, high: (map(.high|tonumber) | max), low: (map(.low|tonumber) | min)})
              | sort_by(.day) | reverse
              | (([.[] | select(price > 0 and ((.high - .low) / price) > 0.0005)] | .[0]) // (.[0] // {day:null, high:null, low:null}));
            {
              asia:   session_range(0; 8; $price),
              london: session_range(8; 16; $price),
              ny:     session_range(13; 21; $price)
            }
          '
          sessions=$(echo "$intraday" | jq -c --argjson price "$price" "$SESSION_FILTER")

          # Module 7 (POI Engine, Fair Value Gap detector): reuse the same 72h
          # hourly fetch already pulled for the Session Engine above - no extra
          # API call. Sorted chronologically ascending (oldest first) so
          # detectors can scan forward through candles without assuming
          # TwelveData's own ordering; never trust it blindly, same reasoning
          # as the "scan forward for a real candle" pattern elsewhere in this
          # file.
          CANDLE_FILTER='
            [(.values // [])[]
              | select((.open|tonumber?) != null and (.high|tonumber?) != null and (.low|tonumber?) != null and (.close|tonumber?) != null)
              | {datetime, open: (.open|tonumber), high: (.high|tonumber), low: (.low|tonumber), close: (.close|tonumber)}]
            | sort_by(.datetime)
          '
          candlesH1=$(echo "$intraday" | jq -c "$CANDLE_FILTER")
          # Spread API requests over time to respect TwelveData minute quotas.
          sleep 8
          h4Raw=$(fetch_optional_series 4h 180)
          m15Raw=$(fetch_optional_series 15min 192)
          m5Raw=$(fetch_optional_series 5min 288)
          candlesMonthly=$(echo "$monthlyRaw" | jq -c "$CANDLE_FILTER")
          candlesWeekly=$(echo "$weeklyRaw" | jq -c "$CANDLE_FILTER")
          candlesDaily=$(echo "$dailyRaw" | jq -c "$CANDLE_FILTER")
          candles4h=$(echo "$h4Raw" | jq -c "$CANDLE_FILTER")
          candles15m=$(echo "$m15Raw" | jq -c "$CANDLE_FILTER")
          candles5m=$(echo "$m5Raw" | jq -c "$CANDLE_FILTER")

          jq -n \
            --argjson quote "$quote" \
            --argjson daily "$daily" \
            --argjson weekly "$weekly" \
            --argjson monthly "$monthly" \
            --argjson sessions "$sessions" \
            --argjson candlesH1 "$candlesH1" \
            --argjson candlesMonthly "$candlesMonthly" \
            --argjson candlesWeekly "$candlesWeekly" \
            --argjson candlesDaily "$candlesDaily" \
            --argjson candles4h "$candles4h" \
            --argjson candles15m "$candles15m" \
            --argjson candles5m "$candles5m" \
            --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              updatedAt: $updatedAt,
              symbol: ($quote.symbol // "XAU/USD"),
              price: ($quote.close | tonumber? // null),
              previousClose: ($quote.previous_close | tonumber? // null),
              changePercent: ($quote.percent_change | tonumber? // null),
              isMarketOpen: ($quote.is_market_open // null),

              dailyOpen: ($daily.open | tonumber? // null),
              dailyHigh: ($daily.high | tonumber? // null),
              dailyLow: ($daily.low | tonumber? // null),
              barDate: ($daily.datetime // null),

              weeklyOpen: ($weekly.open | tonumber? // null),
              weeklyHigh: ($weekly.high | tonumber? // null),
              weeklyLow: ($weekly.low | tonumber? // null),
              weekBarDate: ($weekly.datetime // null),

              monthlyOpen: ($monthly.open | tonumber? // null),
              monthlyHigh: ($monthly.high | tonumber? // null),
              monthlyLow: ($monthly.low | tonumber? // null),
              monthBarDate: ($monthly.datetime // null),

              sessions: {
                asia:   { high: ($sessions.asia.high // null),   low: ($sessions.asia.low // null),   date: ($sessions.asia.day // null) },
                london: { high: ($sessions.london.high // null), low: ($sessions.london.low // null), date: ($sessions.london.day // null) },
                ny:     { high: ($sessions.ny.high // null),     low: ($sessions.ny.low // null),     date: ($sessions.ny.day // null) }
              },

              candles: {
                h1: $candlesH1
              },
              candlesByTimeframe: {
                monthly: {series: $candlesMonthly},
                weekly: {series: $candlesWeekly},
                daily: {series: $candlesDaily},
                "4h": {series: $candles4h},
                "1h": {series: $candlesH1},
                "15min": {series: $candles15m},
                "5min": {series: $candles5m}
              }
            }' > data/market.json
          cat data/market.json

      - name: Ingest — compute Market Brain, detect events, persist state
        run: node scripts/ingest.js

      - name: Compute guarded Trading Brain snapshot (NO live entry signals)
        run: node scripts/build-trading-brain-snapshot.js

      - name: Commit actual market data and safe Trading Brain snapshot
        run: |
          # state/ is DG OS's only real datastore today (see
          # docs/DG_OS_V2_AUDIT.md): a git-committed, restart-safe snapshot
          # plus an append-only event log, written by scripts/ingest.js
          # above. Committed only when something actually changed, so a
          # quiet market doesn't spam the history with no-op commits.
          git config user.name "dg-os-bot"
          git config user.email "dg-os-bot@users.noreply.github.com"
          # CRITICAL FIX: before this, data/ was gitignored and only existed
          # inside a scheduled Actions artifact. The next normal Pages deploy
          # (on a code push) removed it, leaving the public Trading UI empty.
          # Publish ONLY sanitized market.json + read-only snapshot; never
          # raw API responses, credentials or miscellaneous data/* files.
          git add state/ data/market.json data/trading-brain.json
          git diff --cached --quiet || git commit -m "DG OS market evidence: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
