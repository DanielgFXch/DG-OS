<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>DG OS · WHOOP Connection</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf8fb;background:#050b11}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,rgba(40,200,205,.12),transparent 32%),radial-gradient(circle at 85% 20%,rgba(110,73,220,.12),transparent 35%),#050b11}
    main{width:min(560px,100%);padding:28px;border:1px solid rgba(194,229,244,.16);border-radius:22px;background:rgba(10,23,35,.82);backdrop-filter:blur(22px);text-align:center}
    .tag{display:block;margin-bottom:12px;color:#8ee2d7;font-size:11px;letter-spacing:.16em;text-transform:uppercase}h1{margin:0 0 12px;font-size:28px}p{color:#9fb6c3;line-height:1.6}.error{color:#ffc0c4}a{color:#8ee2d7}
  </style>
</head>
<body>
<main>
  <span class="tag">DG OS · WHOOP</span>
  <h1 id="title">WHOOP wird verbunden …</h1>
  <p id="message">Die sichere Verbindung wird an deinen privaten DG OS Server weitergegeben.</p>
</main>
<script>
(() => {
  'use strict';
  const title=document.getElementById('title');
  const message=document.getElementById('message');
  const params=new URLSearchParams(location.search);
  const code=params.get('code');
  const state=params.get('state');
  const error=params.get('error');
  const rawHub=localStorage.getItem('dgos.marketServerUrl') || '';
  let hub='';
  try{ if(rawHub) hub=new URL(rawHub.includes('://')?rawHub:'https://'+rawHub).origin; }catch(_){}

  // Remove the authorization code from browser history as soon as it has been captured.
  history.replaceState(null,'',location.pathname);

  if(error){
    title.textContent='WHOOP-Verbindung abgebrochen';
    message.textContent='WHOOP hat die Autorisierung nicht abgeschlossen. Du kannst zu DG OS zurückkehren und es erneut versuchen.';
    message.className='error';
    return;
  }
  if(!code || !state){
    title.textContent='Ungültige WHOOP-Antwort';
    message.textContent='Es fehlt ein gültiger OAuth-Code oder Sicherheitsstatus. Starte die Verbindung erneut aus DG OS.';
    message.className='error';
    return;
  }
  if(!hub){
    title.textContent='DG OS Server noch nicht verbunden';
    message.textContent='Verbinde zuerst deinen privaten DG OS Server und starte danach die WHOOP-Verbindung erneut. Es wurden keine WHOOP-Tokens im Browser gespeichert.';
    message.className='error';
    return;
  }

  const target=new URL('/api/whoop/oauth/callback',hub);
  target.searchParams.set('code',code);
  target.searchParams.set('state',state);
  target.searchParams.set('redirect_uri','https://danielgfxch.github.io/DG-OS/whoop-callback.html');
  location.replace(target.toString());
})();
</script>
</body>
</html>
