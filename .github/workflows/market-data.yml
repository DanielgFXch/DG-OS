name: Update Market Data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch XAUUSD Market Brain data from TwelveData
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          set -e
          if [ -z "$TWELVEDATA_API_KEY" ]; then
            echo "TWELVEDATA_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p data

          # Shared jq filter (see docs/MARKET_BRAIN.md - "scan forward for a real
          # candle"): TwelveData emits a bar for every calendar period, including
          # ones with no real trading (a flat, carried-forward placeholder). Never
          # trust values[0] blindly - scan forward for the first bar whose range is
          # a meaningful fraction of price (> 0.1%). Reused for daily/weekly/monthly.
          REAL_BAR_FILTER='
            (.values // []) as $v
            | ([$v[] | select(
                 ((.high|tonumber?) as $h | (.low|tonumber?) as $l | (.close|tonumber?) as $c
                  | ($h != null and $l != null and $c != null and $c > 0 and (($h - $l) / $c) > 0.001))
               )] | .[0]) // ($v[0] // {})
          '

          fetch_series() {
            local interval="$1" outputsize="$2"
            local resp status
            resp=$(curl -sS "https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=${interval}&outputsize=${outputsize}&apikey=${TWELVEDATA_API_KEY}")
            status=$(echo "$resp" | jq -r '.status // empty')
            if [ "$status" = "error" ]; then
              echo "TwelveData time_series ($interval) error:" >&2
              echo "$resp" | jq -r '.message // .' >&2
              exit 1
            fi
            echo "$resp" | jq -c "$REAL_BAR_FILTER"
          }

          quote=$(curl -sS "https://api.twelvedata.com/quote?symbol=XAU/USD&apikey=${TWELVEDATA_API_KEY}")
          qstatus=$(echo "$quote" | jq -r '.status // empty')
          if [ "$qstatus" = "error" ]; then
            echo "TwelveData quote error:"
            echo "$quote" | jq -r '.message // .'
            exit 1
          fi

          # /quote's own open/high/low only cover "today" and go misleadingly flat
          # around weekends/day-boundaries - the daily candle from time_series is
          # the reliable source, same reasoning for weekly/monthly.
          daily=$(fetch_series 1day 5)
          weekly=$(fetch_series 1week 3)
          monthly=$(fetch_series 1month 3)

          jq -n \
            --argjson quote "$quote" \
            --argjson daily "$daily" \
            --argjson weekly "$weekly" \
            --argjson monthly "$monthly" \
            --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              updatedAt: $updatedAt,
              symbol: ($quote.symbol // "XAU/USD"),
              price: ($quote.close | tonumber? // null),
              previousClose: ($quote.previous_close | tonumber? // null),
              changePercent: ($quote.percent_change | tonumber? // null),
              isMarketOpen: ($quote.is_market_open // null),

              dailyOpen: ($daily.open | tonumber? // null),
              dailyHigh: ($daily.high | tonumber? // null),
              dailyLow: ($daily.low | tonumber? // null),
              barDate: ($daily.datetime // null),

              weeklyOpen: ($weekly.open | tonumber? // null),
              weeklyHigh: ($weekly.high | tonumber? // null),
              weeklyLow: ($weekly.low | tonumber? // null),
              weekBarDate: ($weekly.datetime // null),

              monthlyOpen: ($monthly.open | tonumber? // null),
              monthlyHigh: ($monthly.high | tonumber? // null),
              monthlyLow: ($monthly.low | tonumber? // null),
              monthBarDate: ($monthly.datetime // null)
            }' > data/market.json
          cat data/market.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
