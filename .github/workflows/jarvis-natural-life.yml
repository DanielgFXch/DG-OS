name: DG OS Natural Life + Photo
on:
  pull_request:
    paths:
      - 'jarvis-shopping-intent.js'
      - 'jarvis-life-intent.js'
      - 'jarvis-life-photo.js'
      - 'jarvis-life-photo.css'
      - 'personal.js'
      - 'jarvis-brain.js'
      - 'index.html'
      - 'supabase/functions/jarvis-private/**'
      - 'scripts/test-jarvis-natural-life.js'
      - 'scripts/test-jarvis-shopping-voice.js'
      - '.github/workflows/jarvis-natural-life.yml'
  push:
    branches: [main]
    paths:
      - 'jarvis-shopping-intent.js'
      - 'jarvis-life-intent.js'
      - 'jarvis-life-photo.js'
      - 'personal.js'
      - 'supabase/functions/jarvis-private/**'
jobs:
  syntax-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check jarvis-shopping-intent.js
      - run: node --check jarvis-life-intent.js
      - run: node --check jarvis-life-photo.js
      - run: node --check personal.js
      - run: node scripts/test-jarvis-natural-life.js
      - run: node scripts/test-jarvis-shopping-voice.js
