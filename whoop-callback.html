<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>DG OS · WHOOP Connection</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf8fb;background:#050b11}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,rgba(40,200,205,.12),transparent 32%),radial-gradient(circle at 85% 20%,rgba(110,73,220,.12),transparent 35%),#050b11}
    main{width:min(560px,100%);padding:28px;border:1px solid rgba(194,229,244,.16);border-radius:22px;background:rgba(10,23,35,.82);backdrop-filter:blur(22px);text-align:center}
    .tag{display:block;margin-bottom:12px;color:#8ee2d7;font-size:11px;letter-spacing:.16em;text-transform:uppercase}h1{margin:0 0 12px;font-size:28px}p{color:#9fb6c3;line-height:1.6}.error{color:#ffc0c4}
  </style>
</head>
<body>
<main>
  <span class="tag">DG OS · WHOOP</span>
  <h1 id="title">WHOOP wird verbunden …</h1>
  <p id="message">Die sichere WHOOP-Verbindung wird abgeschlossen.</p>
</main>
<script>
(() => {
  'use strict';
  const EDGE='https://jzvnmhfhyvmmbontsoej.supabase.co/functions/v1/whoop';
  const title=document.getElementById('title');
  const message=document.getElementById('message');

  const hash=new URLSearchParams(location.hash.replace(/^#/,''));
  const session=hash.get('session');
  const handoff=hash.get('handoff');
  const edgeError=hash.get('error');

  if(handoff==='complete'){
    history.replaceState(null,'',location.pathname);
    title.textContent='WHOOP autorisiert ✓';
    const pending=Boolean(localStorage.getItem('dgos.whoopClaimSecret'));
    if(pending){
      message.textContent='DG OS übernimmt die Verbindung jetzt automatisch …';
      setTimeout(()=>location.replace('./?whoop=handoff#health'),450);
    }else{
      message.textContent='Wechsle jetzt zurück zur DG OS App. Deine App übernimmt die WHOOP-Sitzung automatisch – du musst WHOOP danach nicht erneut verbinden.';
    }
    return;
  }

  if(session){
    localStorage.setItem('dgos.whoopSession',session);
    history.replaceState(null,'',location.pathname);
    location.replace('./?whoop=connected#health');
    return;
  }

  if(edgeError){
    history.replaceState(null,'',location.pathname);
    location.replace('./?whoop=error#health');
    return;
  }

  const params=new URLSearchParams(location.search);
  const code=params.get('code');
  const state=params.get('state');
  const error=params.get('error');

  // Never leave the one-time WHOOP authorization code in browser history.
  history.replaceState(null,'',location.pathname);

  if(error){
    title.textContent='WHOOP-Verbindung abgebrochen';
    message.textContent='WHOOP hat die Autorisierung nicht abgeschlossen. Du kannst zu DG OS zurückkehren und es erneut versuchen.';
    message.className='error';
    return;
  }
  if(!code || !state){
    title.textContent='Ungültige WHOOP-Antwort';
    message.textContent='Es fehlt ein gültiger OAuth-Code oder Sicherheitsstatus. Starte die Verbindung erneut aus DG OS.';
    message.className='error';
    return;
  }

  const target=new URL(EDGE+'/callback');
  target.searchParams.set('code',code);
  target.searchParams.set('state',state);
  location.replace(target.toString());
})();
</script>
</body>
</html>
