name: DG Trading Market Server Deployment Readiness
on:
  pull_request:
    paths:
      - 'render.yaml'
      - 'app.js'
      - 'trading-command.js'
      - 'trading-command.css'
      - 'trading-evidence-gate.js'
      - 'browser-trading-brain.js'
      - 'scripts/test-browser-trading-brain.js'
      - 'trading-trend-context.js'
      - 'trading-direction-compass.js'
      - 'scripts/test-trading-direction-compass.js'
      - 'trading-fomo-guard.js'
      - 'scripts/test-trading-fomo-guard.js'
      - 'scripts/test-trading-trend-context.js'
      - 'index.html'
      - 'scripts/test-trading-evidence-gate.js'
      - 'docs/DG_TRADING_LIVE_START.md'
      - 'scripts/test-trading-live-readiness.js'
      - '.github/workflows/trading-live-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'render.yaml'
      - 'trading-trend-context.js'
      - 'trading-direction-compass.js'
      - 'scripts/test-trading-direction-compass.js'
      - 'trading-fomo-guard.js'
      - 'trading-command.js'
      - 'trading-command.css'
      - 'index.html'
      - 'scripts/test-trading-trend-context.js'
      - 'docs/DG_TRADING_LIVE_START.md'
      - 'scripts/test-trading-live-readiness.js'
jobs:
  validate-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check existing server wiring and secret-safe Render template
        run: node scripts/test-trading-live-readiness.js
      - name: Reject stale, disconnected and unverified Trading Brain signals
        run: |
          node --check trading-evidence-gate.js
          node --check trading-command.js
          node --check app.js
          node scripts/test-trading-evidence-gate.js
      - name: Verify DG trend / targets / countertrend briefing never forces entries
        run: |
          node --check trading-trend-context.js
          node --check trading-command.js
          node scripts/test-trading-trend-context.js
      - name: Verify Jarvis anti-FOMO clarity is evidence-only and fail-closed
        run: |
          node --check trading-fomo-guard.js
          node --check trading-command.js
          node scripts/test-trading-fomo-guard.js
      - name: Verify browser-based TwelveData closed-candle DG analysis never invents entries
        run: |
          node --check browser-trading-brain.js
          node scripts/test-browser-trading-brain.js
      - name: Verify independent BUY/SELL directional preference never forces an entry
        run: |
          node --check trading-direction-compass.js
          node --check jarvis-conversation.js
          node scripts/test-trading-direction-compass.js
      - name: Verify existing session clock and overlap rules
        run: node scripts/test-trading-session-clock.js
