name: Update Market Data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch XAUUSD quote + daily candle from TwelveData
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          set -e
          if [ -z "$TWELVEDATA_API_KEY" ]; then
            echo "TWELVEDATA_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p data

          quote=$(curl -sS "https://api.twelvedata.com/quote?symbol=XAU/USD&apikey=${TWELVEDATA_API_KEY}")
          qstatus=$(echo "$quote" | jq -r '.status // empty')
          if [ "$qstatus" = "error" ]; then
            echo "TwelveData quote error:"
            echo "$quote" | jq -r '.message // .'
            exit 1
          fi

          # /quote's own open/high/low only cover "today" and go misleadingly flat
          # around weekends/day-boundaries when no real session has traded yet. The
          # most recent COMPLETE daily candle from time_series always matches what a
          # chart's wick actually shows.
          #
          # TwelveData emits a daily bar for every calendar day, including weekend
          # days with no real trading (just a flat carried-forward price) - so on a
          # Sunday, values[0] AND values[1] can both be thin (Sun + Sat placeholders)
          # before reaching Friday's real session at values[2]. outputsize=5 gives
          # enough room, and we scan forward for the first bar whose range is a
          # meaningful fraction of price (> 0.1%) rather than assuming a fixed index.
          series=$(curl -sS "https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=1day&outputsize=5&apikey=${TWELVEDATA_API_KEY}")
          sstatus=$(echo "$series" | jq -r '.status // empty')
          if [ "$sstatus" = "error" ]; then
            echo "TwelveData time_series error:"
            echo "$series" | jq -r '.message // .'
            exit 1
          fi
          bar=$(echo "$series" | jq -c '
            (.values // []) as $v
            | ([$v[] | select(
                 ((.high|tonumber?) as $h | (.low|tonumber?) as $l | (.close|tonumber?) as $c
                  | ($h != null and $l != null and $c != null and $c > 0 and (($h - $l) / $c) > 0.001))
               )] | .[0]) // ($v[0] // {})
          ')

          jq -n \
            --argjson quote "$quote" \
            --argjson bar "$bar" \
            --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              updatedAt: $updatedAt,
              symbol: ($quote.symbol // "XAU/USD"),
              price: ($quote.close | tonumber? // null),
              dailyOpen: ($bar.open | tonumber? // null),
              dailyHigh: ($bar.high | tonumber? // null),
              dailyLow: ($bar.low | tonumber? // null),
              barDate: ($bar.datetime // null),
              previousClose: ($quote.previous_close | tonumber? // null),
              changePercent: ($quote.percent_change | tonumber? // null),
              isMarketOpen: ($quote.is_market_open // null)
            }' > data/market.json
          cat data/market.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
