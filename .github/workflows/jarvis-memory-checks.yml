name: Jarvis Memory checks
on:
  push:
    branches:
      - feature/secure-jarvis-memory
  pull_request:
    paths:
      - 'server/api.js'
      - 'server/lib/jarvisMemory*.js'
      - '.github/workflows/jarvis-memory-checks.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/api.js
      - run: node --check server/lib/jarvisMemory.js
      - run: node server/lib/jarvisMemory.test.js
