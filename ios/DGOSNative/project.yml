name: DGOSNative
options:
  bundleIdPrefix: ch.danielgfx
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  DGOSNative:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DGOSNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.danielgfx.dgos
        PRODUCT_NAME: DGOSNative
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DG OS
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
