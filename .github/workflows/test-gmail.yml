name: DG OS Integration Hub Tests

on:
  pull_request:
    paths:
      - 'server/**'
      - 'personal.js'
      - 'personal.css'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/test-gmail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check server/lib/gmailIntegration.js
          node --check server/lib/googleCalendarIntegration.js
          node --check server/lib/whoopIntegration.js
          node --check server/lib/staticApp.js
          node --check server/api.js
          node --check server/index.js
          node --check personal.js
      - name: Integration unit tests
        run: npm run test:integrations
