name: DG OS Jarvis Clean Dashboard
on:
  pull_request:
    paths:
      - 'jarvis-dashboard.js'
      - 'jarvis-dashboard.css'
      - 'index.html'
      - 'sw.js'
      - 'scripts/test-jarvis-dashboard.js'
      - '.github/workflows/jarvis-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'jarvis-dashboard.js'
      - 'jarvis-dashboard.css'
      - 'scripts/test-jarvis-dashboard.js'
jobs:
  verify-jarvis-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check jarvis-dashboard.js
      - name: Real widget movement, shortcuts, privacy and mobile contracts
        run: node scripts/test-jarvis-dashboard.js
      - name: Existing voice and planner regression
        run: |
          node scripts/test-jarvis-voice.js
          node scripts/test-jarvis-brain.js
          node scripts/test-jarvis-shopping-voice.js
          node scripts/test-jarvis-iphone-mic.js
          node scripts/test-jarvis-natural-life.js
