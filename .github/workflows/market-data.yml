name: Update Market Data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch XAUUSD quote + daily candle from TwelveData
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          set -e
          if [ -z "$TWELVEDATA_API_KEY" ]; then
            echo "TWELVEDATA_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p data

          quote=$(curl -sS "https://api.twelvedata.com/quote?symbol=XAU/USD&apikey=${TWELVEDATA_API_KEY}")
          qstatus=$(echo "$quote" | jq -r '.status // empty')
          if [ "$qstatus" = "error" ]; then
            echo "TwelveData quote error:"
            echo "$quote" | jq -r '.message // .'
            exit 1
          fi

          # /quote's own open/high/low only cover "today" and go misleadingly flat
          # around weekends/day-boundaries when no real session has traded yet. The
          # most recent COMPLETE daily candle from time_series always matches what a
          # chart's wick actually shows. outputsize=2 so we can fall back to
          # values[1] (the last real completed trading day) when values[0] turns out
          # to be a thin/still-forming candle.
          #
          # Comparing values[0]'s date string against today (UTC) is NOT reliable
          # here: TwelveData appears to roll its daily candle over before UTC
          # midnight (observed values[0].datetime one day ahead of the runner's own
          # `date -u`), so an exact date match silently never fired. Instead, judge
          # values[0] by its own range: if high-low is a tiny fraction of price
          # (< 0.1%), it hasn't seen real trading yet - use values[1] instead.
          series=$(curl -sS "https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=1day&outputsize=2&apikey=${TWELVEDATA_API_KEY}")
          sstatus=$(echo "$series" | jq -r '.status // empty')
          if [ "$sstatus" = "error" ]; then
            echo "TwelveData time_series error:"
            echo "$series" | jq -r '.message // .'
            exit 1
          fi
          bar=$(echo "$series" | jq -c '
            (.values // []) as $v
            | ($v[0] // {}) as $b0
            | ($v[1] // {}) as $b1
            | ($b0.high | tonumber?) as $h0
            | ($b0.low | tonumber?) as $l0
            | ($b0.close | tonumber?) as $c0
            | (if ($h0 != null and $l0 != null and $c0 != null and $c0 > 0 and (($h0 - $l0) / $c0) > 0.001)
               then $b0
               else ($b1 // $b0)
               end)
          ')

          jq -n \
            --argjson quote "$quote" \
            --argjson bar "$bar" \
            --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              updatedAt: $updatedAt,
              symbol: ($quote.symbol // "XAU/USD"),
              price: ($quote.close | tonumber? // null),
              dailyOpen: ($bar.open | tonumber? // null),
              dailyHigh: ($bar.high | tonumber? // null),
              dailyLow: ($bar.low | tonumber? // null),
              barDate: ($bar.datetime // null),
              previousClose: ($quote.previous_close | tonumber? // null),
              changePercent: ($quote.percent_change | tonumber? // null),
              isMarketOpen: ($quote.is_market_open // null)
            }' > data/market.json
          cat data/market.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
