name: DG OS WHOOP Premium Health UI
on:
  pull_request:
    paths:
      - 'index.html'
      - 'health-premium.css'
      - 'sw.js'
      - 'scripts/test-health-premium.js'
      - '.github/workflows/whoop-premium-health.yml'
  push:
    branches: [main]
    paths:
      - 'health-premium.css'
      - 'scripts/test-health-premium.js'
      - '.github/workflows/whoop-premium-health.yml'
jobs:
  real-health-and-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Premium Health layout and authentic WHOOP data checks
        run: node scripts/test-health-premium.js
      - name: Existing WHOOP sleep analytics regression
        run: node scripts/test-whoop-sleep-analytics.js
      - name: WHOOP authentication/session regression
        run: node scripts/test-whoop-persistence.js
      - name: Existing dashboard and navigation regression
        run: node scripts/test-jarvis-dashboard.js && node scripts/test-premium-ui.js
