name: DG OS TradingView Webhook Security
on:
  pull_request:
    paths:
      - 'supabase/functions/dgos-tradingview/**'
      - 'supabase/migrations/20261013100000_dgos_tradingview_events.sql'
      - 'scripts/test-tradingview-webhook.js'
      - '.github/workflows/tradingview-webhook.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/dgos-tradingview/**'
      - 'supabase/migrations/20261013100000_dgos_tradingview_events.sql'
      - 'scripts/test-tradingview-webhook.js'
jobs:
  security-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-tradingview-webhook.js
